apiVersion: v1
entries:
  neo4j-operator:
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: Initial Helm chart implementation
        - kind: added
          description: Support for both cluster-wide and namespace-scoped deployments
        - kind: added
          description: Configurable RBAC and resource management
        - kind: added
          description: "Neo4jUser, Neo4jRole, Neo4jRoleBinding CRDs for declarative user, role, and privilege management"
        - kind: added
          description: "Cluster status surfacing for SHOW USERS / SHOW ROLES via status.diagnostics"
      artifacthub.io/containsSecurityUpdates: "false"
      artifacthub.io/crds: |-
        - kind: AuraCustomerManagedKey
          version: v1beta1
          description: Registers a customer-managed encryption key with Neo4j Aura for dedicated-tier instances
        - kind: AuraDatabaseBackup
          version: v1beta1
          description: Takes an on-demand per-database backup on a Neo4j Aura instance via the Aura API v2beta1 (beta)
        - kind: AuraDatabaseRestore
          version: v1beta1
          description: Restores a database in place from a per-database backup on a Neo4j Aura instance via the Aura API v2beta1 (beta)
        - kind: AuraDatabase
          version: v1beta1
          description: Manages a database on a Neo4j Aura instance via the Aura API v2beta1 (beta)
        - kind: AuraInstance
          version: v1beta1
          description: Provisions and manages Neo4j Aura cloud instances via the Aura API
        - kind: AuraInvite
          version: v1beta1
          description: Invites a user to a Neo4j Aura organization or project via the Aura API v2beta1 (beta)
        - kind: AuraIPFilter
          version: v1beta1
          description: Manages a Neo4j Aura network IP filter (CIDR allowlist) via the Aura API v2beta1 (beta)
        - kind: AuraOrganizationMember
          version: v1beta1
          description: Manages an Aura console user's organization role via the Aura API v2beta1 (beta)
        - kind: AuraProjectMember
          version: v1beta1
          description: Manages an Aura console user's project role via the Aura API v2beta1 (beta)
        - kind: AuraProviderConfig
          version: v1beta1
          description: Neo4j Aura API credentials and account defaults for Aura orchestration
        - kind: AuraRestore
          version: v1beta1
          description: Restores a Neo4j Aura instance in place from a snapshot
        - kind: AuraSnapshot
          version: v1beta1
          description: Takes on-demand snapshots of Neo4j Aura instances
        - kind: Neo4jAuthRule
          version: v1beta1
          description: Attribute-based access control (ABAC) — claims-to-roles mapping evaluated at OIDC authentication time (Neo4j 2026.03+)
        - kind: Neo4jBackup
          version: v1beta1
          description: Manages Neo4j backup operations
        - kind: Neo4jDatabase
          version: v1beta1
          description: Manages Neo4j databases within clusters
        - kind: Neo4jEnterpriseCluster
          version: v1beta1
          description: Manages Neo4j Enterprise cluster deployments
        - kind: Neo4jEnterpriseStandalone
          version: v1beta1
          description: Manages Neo4j Enterprise standalone deployments
        - kind: Neo4jPlugin
          version: v1beta1
          description: Manages Neo4j plugin installations (APOC, GDS, Bloom, etc.)
        - kind: Neo4jRestore
          version: v1beta1
          description: Manages Neo4j restore operations
        - kind: Neo4jRoleBinding
          version: v1beta1
          description: Role grants for users provisioned externally (SSO/LDAP/OIDC first-login)
        - kind: Neo4jRole
          version: v1beta1
          description: Declarative Neo4j role management with privilege-drift reconciliation
        - kind: Neo4jShardedDatabase
          version: v1beta1
          description: Manages Neo4j property-sharded databases (Infinigraph, GA in 2025.12+)
        - kind: Neo4jUser
          version: v1beta1
          description: Declarative Neo4j user management (passwords from Secrets, role bindings, status, external auth)
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Documentation
          url: https://priyolahiri.github.io/neo4j-kubernetes-operator/
        - name: Support
          url: https://github.com/priyolahiri/neo4j-kubernetes-operator/issues
      artifacthub.io/maintainers: |
        - name: Priyo Lahiri
          email: priyolahiri@users.noreply.github.com
      artifacthub.io/operator: "true"
      artifacthub.io/operatorCapabilities: Full Lifecycle
      artifacthub.io/prerelease: "false"
      artifacthub.io/recommendations: |
        - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
          description: For TLS certificate management

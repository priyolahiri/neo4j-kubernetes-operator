    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          AuraDatabaseRestore restores a database in place from a per-database backup on
          a Neo4j Aura instance (Aura API v2beta1). BETA / best-effort — see
          docs/design/aura-orchestration.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AuraDatabaseRestoreSpec restores a database on a managed Neo4j Aura instance
              from one of its per-database backups (Aura API v2beta1). One-shot, in place.
              BETA / best-effort.
            properties:
              backupId:
                description: |-
                  BackupID is the Aura backup ID to restore from. Mutually exclusive with
                  backupRef.
                type: string
              backupRef:
                description: |-
                  BackupRef resolves the backup ID from an AuraDatabaseBackup (same
                  namespace). Mutually exclusive with backupId.
                type: string
              databaseRef:
                description: DatabaseRef is the AuraDatabase (same namespace) to restore
                  in place.
                type: string
              managementPolicies:
                default:
                - '*'
                description: ManagementPolicies restricts which actions the operator
                  may take.
                items:
                  enum:
                  - Observe
                  - Create
                  - '*'
                  type: string
                type: array
            required:
            - databaseRef
            type: object
            x-kubernetes-validations:
            - message: set exactly one of backupId or backupRef
              rule: has(self.backupId) != has(self.backupRef)
          status:
            description: AuraDatabaseRestoreStatus is the observed state of the restore.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              finishedAt:
                description: FinishedAt is when the restore reached a terminal state.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  Phase mirrors the restore outcome: Restoring while preparing, Submitting
                  while the request is in flight, then Submitted (the TERMINAL success phase)
                  or Error. It is never Completed — Aura restores asynchronously and its
                  v2beta1 database endpoint exposes no status, so completion cannot be
                  observed and is not claimed. A CR found in Submitting means the operator
                  stopped mid-request and the outcome is unknown; it is not retried, because
                  repeating a restore overwrites the database again.
                type: string
              startedAt:
                description: StartedAt is when the restore was submitted.
                format: date-time
                type: string
            type: object

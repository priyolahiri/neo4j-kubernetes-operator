    listKind: Neo4jReplicaPromotionList
    plural: neo4jreplicapromotions
    shortNames:
    - n4jpromo
    - n4jpromotions
    singular: neo4jreplicapromotion
  scope: Namespaced
  versions:
  - additionalPrinterColumns:

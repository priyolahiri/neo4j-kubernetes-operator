    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Neo4jReplicaPromotion is the Schema for the neo4jreplicapromotions
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              Neo4jReplicaPromotionSpec requests the one-way promotion of a cross-cluster
              replica into an ordinary read-write database.

              Deliberately a separate one-shot CR rather than a field on
              Neo4jReplicaDatabase. Promotion is irreversible in Neo4j, so a boolean in a
              level-triggered spec would be dangerous: setting it back to false means
              "make it a replica again", which can only be honoured by dropping and
              re-seeding. A CEL immutability rule closes the interactive path but not the
              one that matters — a GitOps controller re-applying the pre-promotion
              manifest after a failover is byte-identical to a deliberate revert. A
              one-shot CR is inert to re-apply, and matches Neo4jBackup / Neo4jRestore.
            properties:
              replicaRef:
                description: |-
                  ReplicaRef is the Neo4jReplicaDatabase CR in the same namespace to
                  promote.
                type: string
                x-kubernetes-validations:
                - message: spec.replicaRef is immutable
                  rule: self == oldSelf
              topology:
                description: |-
                  Topology optionally changes the database's topology as part of
                  promotion, passed to dbms.promoteReplicaDatabase. When omitted the
                  replica's existing topology is retained.
                properties:
                  primaries:
                    description: |-
                      Number of primary replicas for this database

                      Primaries handle both read and write operations for the database.
                      At least 1 primary is required for database operation.
                    format: int32
                    minimum: 1
                    type: integer
                  secondaries:
                    description: |-
                      Number of secondary replicas for this database

                      Secondaries provide read-only access for horizontal scaling.
                      Secondaries are optional but improve read performance and availability.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: spec.topology is immutable
                  rule: self == oldSelf
            required:
            - replicaRef
            type: object
          status:
            description: Neo4jReplicaPromotionStatus describes the observed state
              of a promotion.
            properties:
              completionTime:
                description: CompletionTime is when the promotion reached a terminal
                  phase.
                format: date-time
                type: string
              conditions:
                description: Conditions reflects the latest reconcile state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastCommittedTxn:
                description: |-
                  LastCommittedTxn is the last transaction the replica had applied at
                  promotion time.
                format: int64
                type: integer
              message:
                description: Message carries a short human-readable explanation of
                  the current Phase.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation observed during the last
                  reconcile.
                format: int64
                type: integer
              observedLagTxIds:
                description: |-
                  ObservedLagTxIds is the replica's replicationLag immediately before
                  promotion — the recovery point that this promotion made permanent.

                  Recorded, never enforced. Blocking a failover on a lag threshold is the
                  wrong default: during a real outage the operator does not get to
                  second-guess the human. But the RPO actually taken must be auditable
                  afterwards.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is Pending, Promoting, Completed or Failed. Completed and Failed
                  are terminal.
                enum:
                - Pending
                - Promoting
                - Completed
                - Failed
                type: string
              promotedDatabase:
                description: PromotedDatabase is the database name that was promoted.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

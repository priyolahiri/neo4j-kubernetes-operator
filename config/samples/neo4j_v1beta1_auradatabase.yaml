apiVersion: neo4j.neo4j.com/v1beta1
kind: AuraDatabase
metadata:
  name: example-aura-database
spec:
  # The AuraInstance (same namespace) that hosts the database. Credentials,
  # organization, and project are resolved from it.
  #
  # IMPORTANT: that instance must have been created with `multiDatabase: true`
  # (see neo4j_v1beta1_aurainstance.yaml). An instance created without it can
  # never host an AuraDatabase — Aura fixes the setting at creation and offers no
  # way to convert one — and this CR will report Ready=False, reason
  # InstanceNotMultiDatabase, without retrying.
  instanceRef: example-aura-instance
  name: analytics
  deletionPolicy: Delete
# NOTE: AuraDatabase is BETA — it uses the Aura API v2beta1, whose contract is
# unstable. Aura manages topology per tier, so there is no topology knob.

apiVersion: neo4j.neo4j.com/v1beta1
kind: AuraIPFilter
metadata:
  name: example-aura-ipfilter
spec:
  providerConfigRef:
    name: example-aura
  # IP filters are organization-scoped in v2beta1. organizationId falls back to
  # the AuraProviderConfig's defaultOrganizationId when omitted.
  organizationId: "<your-aura-org-id>"
  # Instances the filter is applied to (the API's filtered_entities.instances).
  # The operator resolves each AuraInstance to its Aura instance ID. Omit to
  # attach the filter out of band.
  instanceRefs:
    - example-aura-instance
  # The allowlist. v2beta1 splits CIDR notation into address + prefixLen, so
  # "203.0.113.0/24" is {address: 203.0.113.0, prefixLen: 24}.
  allowList:
    - address: "203.0.113.0"
      prefixLen: 24
      description: office
    - address: "198.51.100.7"
      prefixLen: 32
  # Orphan (default) leaves the filter in place on CR deletion (removing it would
  # open network access); Delete removes it from Aura.
  deletionPolicy: Orphan
# NOTE: AuraIPFilter is BETA — it uses the Aura API v2beta1, whose contract is
# unstable. Validate against your account before relying on it.

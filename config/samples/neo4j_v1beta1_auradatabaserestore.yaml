apiVersion: neo4j.neo4j.com/v1beta1
kind: AuraDatabaseRestore
metadata:
  name: example-aura-database-restore
spec:
  # The AuraDatabase (same namespace) to restore in place.
  databaseRef: example-aura-database
  # Provide exactly one of backupId or backupRef.
  backupRef: example-aura-database-backup
  # backupId: "<aura-backup-id>"
# NOTE: BETA (Aura API v2beta1). One-shot, in-place restore.

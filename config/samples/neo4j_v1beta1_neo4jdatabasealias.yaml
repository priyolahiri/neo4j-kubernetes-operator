apiVersion: neo4j.neo4j.com/v1beta1
kind: Neo4jDatabaseAlias
metadata:
  name: example-alias
spec:
  clusterRef: sample-cluster
  # Applications address `foo`; it resolves to the replica while replicating
  # and to the promoted database afterwards, with no client reconfiguration.
  name: foo
  targetDatabase: foo-replica

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: auradatabases.neo4j.neo4j.com
spec:
  group: neo4j.neo4j.com
  names:
    kind: AuraDatabase
    listKind: AuraDatabaseList
    plural: auradatabases
    shortNames:
    - auradb
    singular: auradatabase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.instanceRef
      name: Instance
      type: string
    - jsonPath: .status.databaseId
      name: DatabaseID
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          AuraDatabase manages a database on a Neo4j Aura instance via the Aura API
          v2beta1. BETA / best-effort — see the type doc and docs/design/aura-orchestration.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AuraDatabaseSpec manages a database on a managed Neo4j Aura instance via the
              Aura API v2beta1.

              BETA / best-effort — v2beta1 is an unstable beta and the database create body
              is not fully schema'd upstream. Aura manages replication/topology per tier, so
              this CRD has no topology knob. For databases on a self-managed cluster, use
              Neo4jDatabase instead.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy controls what happens to the Aura database when this CR is
                  deleted: Delete (default; drop it) or Orphan (leave it in place).
                enum:
                - Delete
                - Orphan
                type: string
              instanceRef:
                description: |-
                  InstanceRef is the AuraInstance (same namespace) that hosts the database.
                  Credentials, organization, and project are resolved from it.
                type: string
              managementPolicies:
                default:
                - '*'
                description: ManagementPolicies restricts which actions the operator
                  may take.
                items:
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - '*'
                  type: string
                type: array
              name:
                description: Name is the database name in Aura (defaults to metadata.name).
                maxLength: 63
                type: string
              organizationId:
                description: |-
                  OrganizationID overrides the organization resolved from the instance's
                  AuraProviderConfig (v2beta1 is org-scoped).
                type: string
            required:
            - instanceRef
            type: object
          status:
            description: AuraDatabaseStatus is the observed state of the database.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              databaseId:
                description: |-
                  DatabaseID is the Aura-assigned database ID (mirrored into the
                  neo4j.com/external-database-id annotation for idempotent create + adopt).
                type: string
              lastSyncedTime:
                description: LastSyncedTime is when the database was last observed
                  from the Aura API.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase mirrors the reconcile outcome (Pending, Ready,
                  Error).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

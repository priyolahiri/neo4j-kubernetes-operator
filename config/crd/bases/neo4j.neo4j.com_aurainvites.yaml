---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: aurainvites.neo4j.neo4j.com
spec:
  group: neo4j.neo4j.com
  names:
    kind: AuraInvite
    listKind: AuraInviteList
    plural: aurainvites
    shortNames:
    - aurainvite
    singular: aurainvite
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.email
      name: Email
      type: string
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          AuraInvite invites a user to a Neo4j Aura organization or project via the Aura
          API v2beta1. BETA / best-effort — see docs/design/aura-orchestration.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AuraInviteSpec invites an email to a Neo4j Aura organization (or a project
              within it) with a role, via the Aura API v2beta1.

              This is how a new person is granted Aura console access; an existing member's
              role is managed with AuraOrganizationMember / AuraProjectMember. BETA /
              best-effort.
            properties:
              credentialsSecretRef:
                description: |-
                  CredentialsSecretRef is a single-account shortcut when no
                  AuraProviderConfig is used. Mutually exclusive with providerConfigRef.
                properties:
                  clientIdKey:
                    default: clientId
                    description: ClientIDKey is the Secret key holding the OAuth client
                      ID.
                    type: string
                  clientSecretKey:
                    default: clientSecret
                    description: ClientSecretKey is the Secret key holding the OAuth
                      client secret.
                    type: string
                  name:
                    description: Name of the Secret holding the Aura API client credentials.
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy controls what happens to a still-pending invite when this CR
                  is deleted: Delete (default; revoke it) or Orphan (leave it).
                enum:
                - Delete
                - Orphan
                type: string
              email:
                description: Email is the invitee's email address.
                type: string
              managementPolicies:
                default:
                - '*'
                description: ManagementPolicies restricts which actions the operator
                  may take.
                items:
                  enum:
                  - Observe
                  - Create
                  - Delete
                  - '*'
                  type: string
                type: array
              organizationId:
                description: |-
                  OrganizationID is the Aura organization to invite into. If empty, the
                  referenced AuraProviderConfig's defaultOrganizationId is used.
                type: string
              projectId:
                description: |-
                  ProjectID optionally scopes the invite to a project (a project-member
                  invite). Omit for an organization-level invite.
                type: string
              providerConfigRef:
                description: |-
                  ProviderConfigRef selects the AuraProviderConfig (credentials + defaults)
                  in the same namespace. Mutually exclusive with credentialsSecretRef.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              role:
                description: |-
                  Role is the role to grant on acceptance. Use an ORG_* role for an
                  organization invite, or a PROJECT_*/METRICS_READER role for a
                  project-scoped invite (projectId set).
                enum:
                - ORG_OWNER
                - ORG_ADMIN
                - ORG_MEMBER
                - PROJECT_ADMIN
                - PROJECT_MEMBER
                - PROJECT_VIEWER
                - METRICS_READER
                type: string
            required:
            - email
            - role
            type: object
            x-kubernetes-validations:
            - message: set exactly one of providerConfigRef or credentialsSecretRef
              rule: has(self.providerConfigRef) != has(self.credentialsSecretRef)
          status:
            description: AuraInviteStatus is the observed state of the invite.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              inviteId:
                description: |-
                  InviteID is the Aura-assigned invite ID (mirrored into the
                  neo4j.com/external-invite-id annotation for idempotent create + adopt).
                type: string
              lastSyncedTime:
                description: LastSyncedTime is when the invite was last observed from
                  the Aura API.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase mirrors the reconcile outcome (Pending, Sent, Accepted,
                  Error).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

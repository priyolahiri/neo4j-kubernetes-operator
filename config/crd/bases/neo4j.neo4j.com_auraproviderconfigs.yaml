---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: auraproviderconfigs.neo4j.neo4j.com
spec:
  group: neo4j.neo4j.com
  names:
    kind: AuraProviderConfig
    listKind: AuraProviderConfigList
    plural: auraproviderconfigs
    shortNames:
    - auracfg
    singular: auraproviderconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.defaultProjectId
      name: Project
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          AuraProviderConfig holds Neo4j Aura API credentials and account defaults,
          referenced by Aura resources via spec.providerConfigRef.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AuraProviderConfigSpec configures access to a Neo4j Aura account. It holds the
              API credentials and account-level defaults, and is referenced by AuraInstance
              (and other Aura resources) via spec.providerConfigRef. The controller owns the
              per-credential OAuth token cache and the Aura API rate limiter keyed by this
              config, so all resources sharing a provider config share one token and one
              rate-limit budget (25/125 req/min per credential).
            properties:
              baseUrl:
                description: |-
                  BaseURL overrides the Aura API base URL (default https://api.neo4j.io/v1).
                  Intended for testing against a fake API server; leave empty in production.
                type: string
              credentialsSecretRef:
                description: |-
                  CredentialsSecretRef references the Secret with the OAuth client
                  credentials. The Secret must be in the same namespace as this config.
                properties:
                  clientIdKey:
                    default: clientId
                    description: ClientIDKey is the Secret key holding the OAuth client
                      ID.
                    type: string
                  clientSecretKey:
                    default: clientSecret
                    description: ClientSecretKey is the Secret key holding the OAuth
                      client secret.
                    type: string
                  name:
                    description: Name of the Secret holding the Aura API client credentials.
                    type: string
                required:
                - name
                type: object
              defaultOrganizationId:
                description: |-
                  DefaultOrganizationID is the Aura organization ID used by v2beta1
                  resources (e.g. AuraIPFilter) that reference this config without their own
                  organizationId. Only needed for the hierarchical v2beta1 org/project API.
                type: string
              defaultProjectId:
                description: |-
                  DefaultProjectID is the Aura project (API tenant_id) used by resources
                  that reference this config without specifying their own projectId.
                type: string
            required:
            - credentialsSecretRef
            type: object
          status:
            description: AuraProviderConfigStatus reports whether the credentials
              are usable.
            properties:
              conditions:
                description: |-
                  Conditions: Ready=True once an access token was successfully obtained with
                  the referenced credentials (reason CredentialsValidated).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

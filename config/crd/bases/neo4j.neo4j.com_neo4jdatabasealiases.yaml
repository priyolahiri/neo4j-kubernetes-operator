---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: neo4jdatabasealiases.neo4j.neo4j.com
spec:
  group: neo4j.neo4j.com
  names:
    categories:
    - neo4j
    kind: Neo4jDatabaseAlias
    listKind: Neo4jDatabaseAliasList
    plural: neo4jdatabasealiases
    shortNames:
    - n4jalias
    - n4jaliases
    singular: neo4jdatabasealias
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef
      name: Cluster
      type: string
    - jsonPath: .spec.targetDatabase
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Neo4jDatabaseAlias is the Schema for the neo4jdatabasealiases
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              Neo4jDatabaseAliasSpec defines a local database alias — a second name for an
              existing database in the same DBMS.

              The motivating case is cross-cluster replication failover. Cypher has no
              RENAME DATABASE, so a replica created as `foo-replica` keeps that name
              forever, including after promotion. An alias lets applications address `foo`
              on the downstream cluster throughout: while replicating it resolves to a
              read-only replica, and after promotion the same alias resolves to a
              read-write standard database with no client reconfiguration. Because aliases
              may target a database that is still a replica, the alias is created up front
              rather than during the failover window.

              Scope: LOCAL aliases only. Remote aliases (`... AT '<url>' USER ... PASSWORD
              ...`) and composite-database constituents are not modelled here.
            properties:
              clusterRef:
                description: |-
                  ClusterRef is the Neo4jEnterpriseCluster or Neo4jEnterpriseStandalone in
                  the same namespace that hosts both the alias and its target.
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy controls what happens to the alias in Neo4j when this CR
                  is deleted.
                    Delete (default): DROP ALIAS.
                    Retain:           leave it in place, release the finalizer only.
                enum:
                - Delete
                - Retain
                type: string
              name:
                description: Name is the alias name in Neo4j. Defaults to metadata.name
                  when empty.
                maxLength: 63
                minLength: 3
                pattern: ^[a-zA-Z][a-zA-Z0-9_.\-]*$
                type: string
              targetDatabase:
                description: |-
                  TargetDatabase is the database this alias points at. It may be a
                  standard database or a cross-cluster replica; the alias survives the
                  replica's promotion unchanged.

                  The target does not have to exist yet — the controller reports Pending
                  and retries rather than failing, so an alias and its replica can be
                  applied together.
                maxLength: 63
                minLength: 1
                type: string
            required:
            - clusterRef
            - targetDatabase
            type: object
          status:
            description: Neo4jDatabaseAliasStatus describes the observed state of
              a Neo4jDatabaseAlias.
            properties:
              conditions:
                description: |-
                  Conditions reflects the latest reconcile state. Conditions used:
                    Ready            — alias exists and points at spec.targetDatabase
                    ClusterNotReady  — referenced cluster is not Ready
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message carries a short human-readable explanation of
                  the current Phase.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation observed during the last
                  successful reconcile.
                format: int64
                type: integer
              observedTarget:
                description: |-
                  ObservedTarget is the database the alias actually resolves to, read back
                  from SHOW ALIASES FOR DATABASE. Differs from spec.targetDatabase only
                  between an out-of-band change and the next reconcile.
                type: string
              phase:
                description: 'Phase is a coarse summary: Pending, Ready, Failed.'
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

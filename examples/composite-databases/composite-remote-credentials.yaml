# A remote constituent authenticated by STORED credentials.
#
# Use this only where OIDC credential forwarding is not available — see
# composite-remote-oidc.yaml, which stores nothing and needs no keystore.
#
# Neo4j encrypts alias credentials in the system database, which is why this
# mode requires a keystore on the deployment. Without one the server refuses to
# create the alias; the operator rejects the CR at apply time naming the field
# to set, rather than failing later inside the server with an internal
# 50N09/50N00 error that mentions neither the CR nor the constituent.
#
# Create the keystore with the JDK's keytool — ideally on the same Java version
# Neo4j runs, as Neo4j advises:
#
#   keytool -genseckey -keyalg aes -keysize 256 -storetype pkcs12 \
#           -keystore keystore.p12 -alias my-key -storepass "$PASSWORD"
#
#   kubectl create secret generic remote-alias-keystore \
#           --from-file=keystore.p12 --from-literal=password="$PASSWORD"
#
# DANGER: rotating the keystore or changing keyName makes every existing
# remote-alias credential permanently unreadable, and the aliases must be
# recreated. Treat rotation as delete-and-recreate, not an edit.
apiVersion: neo4j.neo4j.com/v1beta1
kind: Neo4jEnterpriseCluster
metadata:
  name: prod-cluster
  namespace: neo4j
spec:
  acceptLicenseAgreement: "eval"
  image:
    repo: neo4j
    # Remote constituents with STORED credentials work on the 5.26 LTS too.
    # It is OIDC credential forwarding that needs Cypher 25, so a CalVer image.
    tag: "2026.08.1-enterprise"
  topology:
    servers: 3
  storage:
    size: "10Gi"
  resources:
    requests:
      memory: "2Gi"
    limits:
      # The operator sizes the JVM from the memory LIMIT, so it is required.
      memory: "4Gi"

  # Every server mounts the same Secret, which is what satisfies Neo4j's
  # requirement that the keystore be identical across a cluster.
  remoteAliasKeystore:
    secretRef: remote-alias-keystore   # keys: keystore.p12, password
    keyName: my-key
---
apiVersion: v1
kind: Secret
metadata:
  name: partner-creds
  namespace: neo4j
type: Opaque
stringData:
  username: federated-reader
  password: replace-me
---
apiVersion: neo4j.neo4j.com/v1beta1
kind: Neo4jCompositeDatabase
metadata:
  name: federated
  namespace: neo4j
spec:
  clusterRef: prod-cluster
  constituents:
    - name: partner
      targetDatabase: movies
      remote:
        url: neo4j+s://partner.example.com:7687

        # The operator passes the password to Neo4j as a Cypher PARAMETER,
        # never interpolated into the statement text, so it does not reach the
        # query log. SHOW ALIASES never returns a password on any alias, so
        # alias output is safe to include in a support bundle.
        credentialsSecretRef: partner-creds   # keys: username, password

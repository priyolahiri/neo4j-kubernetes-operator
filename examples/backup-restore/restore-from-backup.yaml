# ============================================================
# Restore from a Neo4jBackup reference.
#
# Clusters and standalones both restore ONLINE: only the restored database is
# unavailable, the instance keeps running, and stopCluster is not needed. (A
# standalone falls back to an offline neo4j-admin Job, which needs
# stopCluster: true, for point-in-time restores that cannot run online,
# source.type storage, and cloud storage by pod identity when the standalone
# sets no spec.podServiceAccountAnnotations — see the backup guide.)
#
# Hooks (spec.options.{preRestore,postRestore}) run on every target:
#   - preRestore hooks run BEFORE the restore is issued (Cypher like
#     CALL db.checkpoint() hits a live Bolt endpoint).
#   - postRestore hooks run once the restored database is online.
# ============================================================
apiVersion: neo4j.neo4j.com/v1beta1
kind: Neo4jRestore
metadata:
  name: simple-restore
  labels:
    environment: development
    restore-type: backup-reference
spec:
  # Matches the CR created by examples/standalone/single-node-standalone.yaml —
  # change to YOUR instance name.
  instanceRef: standalone-neo4j
  database: neo4j
  source:
    type: backup
    backupRef: simple-backup  # Reference to the backup resource
  options:
    # replaceExisting confirms overwriting an existing database (standalone
    # and cluster targets alike).
    replaceExisting: true
    preRestore:
      cypherStatements:
        - "CALL db.checkpoint()"   # flush pending writes before the restore
    postRestore:
      cypherStatements:
        - "CALL db.awaitIndexes()"
        - "CALL dbms.security.clearAuthCache()"
  timeout: "1h"

---
# More complex restore with a post-restore validation Job hook.
apiVersion: neo4j.neo4j.com/v1beta1
kind: Neo4jRestore
metadata:
  name: restore-with-validation
  labels:
    environment: staging
    restore-type: with-hooks
spec:
  instanceRef: staging-standalone   # Neo4jEnterpriseStandalone
  database: myapp
  source:
    type: backup
    backupRef: daily-backup
  options:
    replaceExisting: true   # confirms overwriting the existing database
    postRestore:
      job:
        template:
          container:
            image: neo4j:5.26-enterprise
            command: ["/bin/sh"]
            args:
              - "-c"
              - |
                echo "Validating restored database..."
                # -a is required: the hook Job runs in its own pod, so
                # cypher-shell must be pointed at the instance's service
                # (<standalone-name>-client) — without it, it dials localhost.
                cypher-shell -a neo4j://staging-standalone-client:7687 \
                  -u neo4j -p "$NEO4J_PASSWORD" -d myapp \
                  "MATCH (n) RETURN count(n) as nodeCount"
                echo "Database validation completed"
            env:
              - name: NEO4J_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: neo4j-admin-secret
                    key: password
        timeout: "10m"
  timeout: "2h"

# DOWNSTREAM cluster (Kubernetes cluster B) — the read-only replica.
#
# The two Kubernetes clusters never talk to each other. The only coupling is
# the object-storage bucket. Requires Neo4j 2026.08+ on this cluster.
# ── BEFORE this works, the DOWNSTREAM CLUSTER needs the bucket credentials ────
# The seed and every pull are done by the Neo4j SERVER, not by a Job, so the
# credentials must be in the server's own environment. Setting
# source.credentialsSecretRef below does NOT do this — it records WHICH Secret
# they come from; the operator checks the cluster actually carries them and
# fails fast if not. On the downstream Neo4jEnterpriseCluster:
#
#   spec:
#     env:
#       - name: AWS_REGION
#         valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_REGION}}
#       - name: AWS_ACCESS_KEY_ID
#         valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_ACCESS_KEY_ID}}
#       - name: AWS_SECRET_ACCESS_KEY
#         valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_SECRET_ACCESS_KEY}}
#       - name: AWS_ENDPOINT_URL_S3      # S3-compatible stores (MinIO) only
#         value: http://minio.minio.svc:9000
#
# Without it the replica fails immediately with a message naming AWS_REGION,
# rather than stalling while the server refuses inside the AWS SDK. Network
# mode needs none of this. See
# docs/user_guide/guides/cross_cluster_replication.md step 2.

apiVersion: neo4j.neo4j.com/v1beta1
kind: Neo4jReplicaDatabase
metadata:
  name: inventory-replica
  namespace: dr
spec:
  clusterRef: dr-cluster
  upstreamDatabase: inventory
  topology:
    primaries: 3
    secondaries: 0
  pullInterval: 1m             # db.cluster.backup.pull_interval — bounds the RPO
  source:
    mode: backup               # `network` is not supported; see the guide
    # Both URIs come from the upstream Neo4jBackup's status.replicationPullURI.
    # spec.source is IMMUTABLE — Neo4j cannot re-point an existing replica.
    pullURI: s3://prod-backups/inventory/inventory-chain/
    seedURI: s3://prod-backups/inventory/inventory-chain/inventory-2026-08-01T02-00-00.backup
    credentialsSecretRef: s3-creds
---
# Replicas are READ-ONLY on both primaries and secondaries. Clients must use
# AccessMode.READ / executeRead, or `cypher-shell --access-mode=read`.

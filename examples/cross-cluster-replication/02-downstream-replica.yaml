# DOWNSTREAM cluster (Kubernetes cluster B) — the read-only replica.
#
# The two Kubernetes clusters never talk to each other. The only coupling is
# the object-storage bucket. Requires Neo4j 2026.08+ on this cluster.
apiVersion: neo4j.neo4j.com/v1beta1
kind: Neo4jReplicaDatabase
metadata:
  name: inventory-replica
  namespace: dr
spec:
  clusterRef: dr-cluster
  upstreamDatabase: inventory
  topology:
    primaries: 3
    secondaries: 0
  pullInterval: 1m             # db.cluster.backup.pull_interval — bounds the RPO
  source:
    mode: backup               # `network` is not supported; see the guide
    # Both URIs come from the upstream Neo4jBackup's status.replicationPullURI.
    # spec.source is IMMUTABLE — Neo4j cannot re-point an existing replica.
    pullURI: s3://prod-backups/inventory/inventory-chain/
    seedURI: s3://prod-backups/inventory/inventory-chain/inventory-2026-08-01T02-00-00.backup
    credentialsSecretRef: s3-creds
---
# Replicas are READ-ONLY on both primaries and secondaries. Clients must use
# AccessMode.READ / executeRead, or `cypher-shell --access-mode=read`.

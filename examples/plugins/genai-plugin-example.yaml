# NOTE: the GenAI plugin is not covered by integration tests — validate in your
# own environment.
# GenAI Plugin Example - AI Provider Integration
# GenAI plugin enables vector embeddings and AI integrations

apiVersion: neo4j.neo4j.com/v1beta1
kind: Neo4jPlugin
metadata:
  name: genai-plugin
  namespace: default
spec:
  # Can reference either Neo4jEnterpriseCluster or Neo4jEnterpriseStandalone
  clusterRef: my-cluster

  name: genai
  version: "1.0.0"
  enabled: true

  source:
    type: official

  # The GenAI plugin needs no settings: provider credentials and models are
  # arguments of its procedures and functions, e.g.
  #   genai.vector.encode(text, 'OpenAI', {token: $openaiToken})   (5.26)
  #   ai.text.embed(text, 'OpenAI', {token: $openaiToken, model: '...'})   (CalVer)
  # so they never reach the StatefulSet.
  #
  # Every key here becomes a NEO4J_<setting> variable on the servers, and Neo4j
  # refuses to start on a setting it does not know. Only list settings your
  # Neo4j version documents, for example on CalVer:
  #   genai.openai.baseurl: "https://llm-proxy.internal"        # CalVer only
  #   genai.azure.openai.baseurl: "https://azure-proxy.internal" # 2026.04+
  # Removing a key here removes its variable from the servers (one restart).
  # config: {}

  # Security configuration. CalVer 2025.11+ also exposes the procedures as
  # ai.* (genai.* is the deprecated prefix there); 5.26 has genai.* only.
  security:
    allowedProcedures:
      - "genai.*"
      - "ai.*"
    sandbox: false

# The GenAI plugin enables:
# - Vector similarity search
# - Text embedding generation
# - Integration with AI providers (OpenAI, Vertex AI, Azure OpenAI, Bedrock)

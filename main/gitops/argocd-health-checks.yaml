  resource.customizations.health.neo4j.neo4j.com_Neo4jReplicaDatabase: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
      hs.status = "Progressing"
      hs.message = "Waiting for replica status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Replicating" then
      hs.status = "Healthy"
      hs.message = obj.status.message or "Replica is online"
    elseif phase == "Promoted" then
      -- Terminal and intentional: the database was promoted and is no longer
      -- a replica. Healthy, not Degraded — this is a completed failover, and
      -- the CR is now inert by design. Do NOT let Argo try to "fix" it.
      hs.status = "Healthy"
      hs.message = obj.status.message or "Replica was promoted; this CR is inert"
    elseif phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.message or "Replica reconciliation failed"
    else
      -- "Pending"/"Seeding" — waiting for the cluster, or restoring the
      -- initial full backup, which can take a while for a large database.
      hs.status = "Progressing"
      hs.message = obj.status.message or ("Replica is " .. phase)
    end
    return hs


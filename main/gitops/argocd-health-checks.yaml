  # ---------------------------------------------------------------------------
  # Neo4j Aura (cloud) CRDs — beta.
  #
  # These key off the `Ready` CONDITION rather than status.phase. For the
  # self-managed CRDs above, phase is an operator-owned vocabulary; for Aura it
  # largely mirrors Aura's OWN API status (e.g. AuraInstance copies the live
  # instance status verbatim), which is an open vocabulary Neo4j can extend
  # without a version bump. Enumerating running states here would silently
  # report new ones as Degraded. Every Aura controller sets a Ready condition,
  # so that is the stable signal.
  #
  # phase is still consulted first for terminal errors, because the Ready
  # condition can lag a failure by a reconcile.
  # ---------------------------------------------------------------------------

  resource.customizations.health.neo4j.neo4j.com_AuraProviderConfig: |
    hs = {}
    if obj.status == nil then
      hs.status = "Progressing"
      hs.message = "Waiting for provider config status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Error" or phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.message or ("Aura provider config is " .. phase)
      return hs
    end
    if obj.status.conditions ~= nil then
      for i, c in ipairs(obj.status.conditions) do
        if c.type == "Ready" and c.status == "True" then
          hs.status = "Healthy"
          hs.message = c.message or "Aura provider config is ready"
          return hs
        end
      end
    end
    hs.status = "Progressing"
    hs.message = obj.status.message or "Waiting for Aura provider config to become ready"
    return hs


# Apply to your ArgoCD installation to enable health checks for Neo4j operator resources.
#
# Usage:
#   kubectl patch configmap argocd-cm -n argocd \
#     --type merge --patch-file docs/gitops/argocd-health-checks.yaml
#
# Or include in your ArgoCD App-of-Apps configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.health.neo4j.neo4j.com_Neo4jEnterpriseCluster: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
      hs.status = "Progressing"
      hs.message = "Waiting for cluster status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Ready" then
      hs.status = "Healthy"
      hs.message = obj.status.message or "Neo4j cluster is ready"
    elseif phase == "Failed" or phase == "Degraded" then
      hs.status = "Degraded"
      hs.message = obj.status.message or "Neo4j cluster is in a failed state"
    else
      hs.status = "Progressing"
      hs.message = obj.status.message or ("Neo4j cluster is " .. phase)
    end
    return hs

  resource.customizations.health.neo4j.neo4j.com_Neo4jEnterpriseStandalone: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
      hs.status = "Progressing"
      hs.message = "Waiting for standalone status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Ready" then
      hs.status = "Healthy"
      hs.message = obj.status.message or "Neo4j standalone is ready"
    elseif phase == "Failed" or phase == "Degraded" then
      hs.status = "Degraded"
      hs.message = obj.status.message or "Neo4j standalone is in a failed state"
    else
      hs.status = "Progressing"
      hs.message = obj.status.message or ("Neo4j standalone is " .. phase)
    end
    return hs

  resource.customizations.health.neo4j.neo4j.com_Neo4jDatabase: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
      hs.status = "Progressing"
      hs.message = "Waiting for database status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Ready" then
      hs.status = "Healthy"
      hs.message = obj.status.message or "Database is ready"
    elseif phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.message or "Database creation failed"
    else
      hs.status = "Progressing"
      hs.message = obj.status.message or ("Database is " .. phase)
    end
    return hs

  resource.customizations.health.neo4j.neo4j.com_Neo4jBackup: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
      hs.status = "Progressing"
      hs.message = "Waiting for backup status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Succeeded" or phase == "Completed" or phase == "Ready" then
      hs.status = "Healthy"
      hs.message = obj.status.message or "Backup completed"
    elseif phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.message or "Backup failed"
    else
      hs.status = "Progressing"
      hs.message = obj.status.message or ("Backup is " .. phase)
    end
    return hs

  resource.customizations.health.neo4j.neo4j.com_Neo4jRestore: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
      hs.status = "Progressing"
      hs.message = "Waiting for restore status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Completed" or phase == "Ready" then
      hs.status = "Healthy"
      hs.message = obj.status.message or "Restore completed"
    elseif phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.message or "Restore failed"
    else
      hs.status = "Progressing"
      hs.message = obj.status.message or ("Restore is " .. phase)
    end
    return hs

  resource.customizations.health.neo4j.neo4j.com_Neo4jPlugin: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
      hs.status = "Progressing"
      hs.message = "Waiting for plugin status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Ready" or phase == "Installed" then
      hs.status = "Healthy"
      hs.message = obj.status.message or "Plugin is installed and ready"
    elseif phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.message or "Plugin installation failed"
    else
      hs.status = "Progressing"
      hs.message = obj.status.message or ("Plugin is " .. phase)
    end
    return hs

  resource.customizations.health.neo4j.neo4j.com_Neo4jShardedDatabase: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
      hs.status = "Progressing"
      hs.message = "Waiting for sharded database status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Ready" then
      hs.status = "Healthy"
      hs.message = obj.status.message or "Sharded database is ready"
    elseif phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.message or "Sharded database failed"
    else
      hs.status = "Progressing"
      hs.message = obj.status.message or ("Sharded database is " .. phase)
    end
    return hs

  resource.customizations.health.neo4j.neo4j.com_Neo4jUser: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
      hs.status = "Progressing"
      hs.message = "Waiting for user status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Ready" then
      hs.status = "Healthy"
      hs.message = obj.status.message or "User is in sync"
    elseif phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.message or "User reconciliation failed"
    else
      hs.status = "Progressing"
      hs.message = obj.status.message or ("User is " .. phase)
    end
    return hs

  resource.customizations.health.neo4j.neo4j.com_Neo4jRole: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
      hs.status = "Progressing"
      hs.message = "Waiting for role status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Ready" then
      hs.status = "Healthy"
      hs.message = obj.status.message or "Role is in sync"
    elseif phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.message or "Role reconciliation failed"
    else
      hs.status = "Progressing"
      hs.message = obj.status.message or ("Role is " .. phase)
    end
    return hs

  resource.customizations.health.neo4j.neo4j.com_Neo4jRoleBinding: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
      hs.status = "Progressing"
      hs.message = "Waiting for role binding status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Ready" then
      hs.status = "Healthy"
      hs.message = obj.status.message or "Role binding is in sync"
    elseif phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.message or "Role binding reconciliation failed"
    else
      -- "Pending" covers UserNotFound (waiting for externally-provisioned
      -- user to appear) and the cluster-not-ready cases — both are normal
      -- transient states, not failures.
      hs.status = "Progressing"
      hs.message = obj.status.message or ("Role binding is " .. phase)
    end
    return hs

  resource.customizations.health.neo4j.neo4j.com_Neo4jAuthRule: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
      hs.status = "Progressing"
      hs.message = "Waiting for auth rule status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Ready" then
      hs.status = "Healthy"
      hs.message = obj.status.message or "Auth rule is in sync"
    elseif phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.message or "Auth rule reconciliation failed"
    else
      -- "PendingDependencies" means one or more granted roles haven't
      -- been created yet — auto-reconciles when the roles land.
      hs.status = "Progressing"
      hs.message = obj.status.message or ("Auth rule is " .. phase)
    end
    return hs

  resource.customizations.health.neo4j.neo4j.com_Neo4jDatabaseAlias: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
      hs.status = "Progressing"
      hs.message = "Waiting for alias status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Ready" then
      hs.status = "Healthy"
      hs.message = obj.status.message or "Alias is in sync"
    elseif phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.message or "Alias reconciliation failed"
    else
      -- "Pending" covers the target database not existing yet, which is
      -- normal when an alias and its database are applied together.
      hs.status = "Progressing"
      hs.message = obj.status.message or ("Alias is " .. phase)
    end
    return hs

  resource.customizations.health.neo4j.neo4j.com_Neo4jReplicaDatabase: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
      hs.status = "Progressing"
      hs.message = "Waiting for replica status"
      return hs
    end
    phase = obj.status.phase
    if phase == "Replicating" then
      hs.status = "Healthy"
      hs.message = obj.status.message or "Replica is online"
    elseif phase == "Promoted" then
      -- Terminal and intentional: the database was promoted and is no longer
      -- a replica. Healthy, not Degraded — this is a completed failover, and
      -- the CR is now inert by design. Do NOT let Argo try to "fix" it.
      hs.status = "Healthy"
      hs.message = obj.status.message or "Replica was promoted; this CR is inert"
    elseif phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.message or "Replica reconciliation failed"
    else
      -- "Pending"/"Seeding" — waiting for the cluster, or restoring the
      -- initial full backup, which can take a while for a large database.
      hs.status = "Progressing"
      hs.message = obj.status.message or ("Replica is " .. phase)
    end
    return hs

  resource.customizations.health.neo4j.neo4j.com_Neo4jReplicaPromotion: |
    hs = {}
    if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then

version: "2"
run:
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
linters:
  enable:
    - bodyclose
    - errname
    - errorlint
    - forcetypeassert
    - ginkgolinter
    - gocritic
    - gosec
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wastedassign
    - whitespace
  disable:
    - contextcheck
    - cyclop
    - dupl
    - errcheck
    - exhaustive
    - exhaustruct
    - funlen
    - gochecknoglobals
    - gocognit
    - goconst
    - gocyclo
    - lll
    - misspell
    - nestif
    - nilnil
    - prealloc
    - testpackage
    - unparam
    - varnamelen
    - wrapcheck
    - wsl
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
    ginkgolinter:
      suppress-len-assertion: true
      suppress-nil-assertion: true
      suppress-err-assertion: true
      suppress-compare-assertion: true
      suppress-async-assertion: true
      suppress-type-compare-assertion: true
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 5
      min-occurrences: 5
    gocritic:
      disabled-checks:
        - sprintfQuotedString
        - commentedOutCode
        - ifElseChain
        - assignOp
        - unnecessaryDefer
      enabled-tags:
        - diagnostic
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G204
        - G304
        - G115
      severity: high
      confidence: high
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    lll:
      line-length: 120
      tab-width: 4
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: var-naming
          disabled: true
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # controller-runtime v0.24's mgr.GetEventRecorderFor (old record.EventRecorder
      # API) is deprecated in favour of GetEventRecorder (new events.EventRecorder,
      # different Eventf signature). Migrating touches every controller's Recorder
      # field + all Event/Eventf call sites + test wiring; upstream itself still
      # uses GetEventRecorderFor with //nolint. Tracked as a separate migration.
      # (Match is a substring, not the full staticcheck message, since the
      # fully-qualified type prefix varies by controller-runtime version.)
      - linters:
          - staticcheck
        text: 'SA1019: .*GetEventRecorderFor is deprecated'
      # scheme.Builder in the api package is the standard kubebuilder scaffolding
      # pattern; the deprecation is advisory for dependency-minimal api packages.
      - linters:
          - staticcheck
        path: api/v1beta1/groupversion_info\.go
        text: 'SA1019: .*scheme\.Builder is deprecated'
      - linters:
          - deadcode
          - dupl
          - goconst
          - gocyclo
          - gosec
          - structcheck
          - unparam
          - unused
          - varcheck
        path: _test\.go
      - linters:
          - dupl
          - gocritic
          - gocyclo
          - lll
          - staticcheck
          - unused
        path: zz_generated\.deepcopy\.go
      - linters:
          - unparam
          - unused
        path: cmd/main\.go
      - linters:
          - goconst
          - lll
        path: api/.*\.go
      - linters:
          - unparam
          - unused
        path: internal/webhooks/.*\.go
      - linters:
          - gosec
        text: 'G104:'
      - linters:
          - gocritic
        path: .*_test\.go
        text: Magic number
      - linters:
          - gocritic
        text: hugeParam.*constructor
      - linters:
          - gocritic
        text: empty-block
      - linters:
          - errcheck
          - gocritic
          - gosec
        path: hack/.*
      - linters:
          - errcheck
          - gocritic
          - gosec
        path: scripts/.*
      - path: (.+)\.go$
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv). is not checked
      - path: (.+)\.go$
        text: func name will be used as test\.Test.* by other packages, and that stutters; consider calling this
      - path: (.+)\.go$
        text: 'G104: Errors unhandled\.'
      - path: (.+)\.go$
        text: 'G204: Subprocess launched with variable'
      - path: (.+)\.go$
        text: 'G304: Potential file inclusion via variable'
      - linters:
          - goconst
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 10
  max-same-issues: 5
  new: false
  fix: false
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

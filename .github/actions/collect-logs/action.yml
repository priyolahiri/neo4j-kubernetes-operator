name: 'Collect Cluster Logs'
description: 'Collects Kubernetes cluster + Neo4j pod logs. Gate the invocation
  with `if: failure()` in the CALLING workflow — this action does NOT self-gate
  (see the note above the steps).'

inputs:
  artifact-name:
    description: 'Name for the log artifact'
    required: false
    default: 'cluster-logs'

# DO NOT put `if: failure()` on the steps below.
#
# Inside a composite action, failure()/success() evaluate against THIS action's
# own step statuses — not the calling job's. The steps here previously carried
# `if: failure()`, so on a failing run nothing inside the action had failed yet,
# failure() was false, and every step was silently skipped: no logs were ever
# collected and the artifact never appeared (verified on run 30304634581, where
# the whole action opened and closed in 0.2ms after a 5-spec failure).
#
# The CALLER decides when to run this action — a workflow-level `if: failure()`
# does correctly see job status. These steps must stay unconditional.
runs:
  using: 'composite'
  steps:
    - name: Collect cluster info
      if: always()
      shell: bash
      run: |
        echo "=== Cluster Info ===" > cluster-debug.log
        kubectl get nodes -o wide >> cluster-debug.log 2>&1 || true
        kubectl get pods -A >> cluster-debug.log 2>&1 || true

        echo "=== Operator Logs ===" >> cluster-debug.log
        kubectl logs -n neo4j-operator-system deployment/neo4j-operator-controller-manager >> cluster-debug.log 2>&1 || true

        # Neo4j pod describe + logs (current AND previous) — the OOMKilled /
        # "declared multiple times" / exit-137 crash signal lives here, not in the
        # operator logs. Skip system namespaces; bound output with --tail.
        echo "=== Neo4j Pod Describe + Logs ===" >> cluster-debug.log
        for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          case "$ns" in kube-system|kube-public|kube-node-lease|local-path-storage|cert-manager) continue;; esac
          for pod in $(kubectl get pods -n "$ns" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            echo "--- describe $ns/$pod ---" >> cluster-debug.log
            kubectl describe pod -n "$ns" "$pod" >> cluster-debug.log 2>&1 || true
            echo "--- logs $ns/$pod (current) ---" >> cluster-debug.log
            kubectl logs -n "$ns" "$pod" --all-containers --tail=200 >> cluster-debug.log 2>&1 || true
            echo "--- logs $ns/$pod (previous/crashed) ---" >> cluster-debug.log
            kubectl logs -n "$ns" "$pod" --all-containers --previous --tail=200 >> cluster-debug.log 2>&1 || true
          done
        done

        echo "=== CRD Status ===" >> cluster-debug.log
        kubectl get crd | grep neo4j >> cluster-debug.log 2>&1 || true

        echo "=== Events ===" >> cluster-debug.log
        kubectl get events -A --sort-by='.lastTimestamp' >> cluster-debug.log 2>&1 || true

    # A pod that never became Ready is the usual root cause of an integration
    # failure (crash-looping Neo4j, OOMKill, a config key Neo4j refuses). Print
    # those container logs to the JOB LOG as well as the artifact, so a red run
    # is diagnosable from the log alone without downloading anything.
    - name: Surface not-Ready pod logs in the job log
      if: always()
      shell: bash
      run: |
        found=0
        for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          case "$ns" in kube-system|kube-public|kube-node-lease|local-path-storage|cert-manager) continue;; esac
          for pod in $(kubectl get pods -n "$ns" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            # Empty containerStatuses (pod still Pending) is as interesting as an
            # explicit ready=false, so treat both as not-Ready.
            ready=$(kubectl get pod -n "$ns" "$pod" -o jsonpath='{.status.containerStatuses[*].ready}' 2>/dev/null || true)
            case "$ready" in
              *false*|'') ;;
              *) continue;;
            esac
            found=1
            echo "::group::not-Ready $ns/$pod"
            kubectl get pod -n "$ns" "$pod" -o wide 2>&1 || true
            echo "--- current container logs (tail 300) ---"
            kubectl logs -n "$ns" "$pod" --all-containers --tail=300 2>&1 || true
            echo "--- previous (crashed) container logs (tail 300) ---"
            kubectl logs -n "$ns" "$pod" --all-containers --previous --tail=300 2>&1 || true
            echo "::endgroup::"
          done
        done
        if [ "$found" = 0 ]; then
          echo "(every pod reported Ready — nothing to surface)"
        fi

    # The step above only fires for a NOT-READY pod. A failure where every pod
    # is healthy and the OPERATOR is the thing erroring produces "(every pod
    # reported Ready — nothing to surface)" and nothing else, leaving the job
    # log with no signal at all — the operator log goes only to the artifact.
    #
    # That cost a full extra diagnosis pass on the PR #337 failure: a Neo4jUser
    # never reached Ready while its cluster was entirely healthy, and the cause
    # (the same reconcile error repeating for 10 minutes) was invisible until
    # someone downloaded the artifact. The frequency summary below is the part
    # that matters for that shape of failure: it collapses hundreds of identical
    # reconcile errors into one counted line.
    - name: Surface operator errors in the job log
      if: always()
      shell: bash
      run: |
        ns=neo4j-operator-system
        dep=deployment/neo4j-operator-controller-manager
        if ! kubectl get -n "$ns" "$dep" >/dev/null 2>&1; then
          echo "(no operator deployment in $ns — nothing to surface)"
          exit 0
        fi

        log=$(mktemp)
        kubectl logs -n "$ns" "$dep" --tail=-1 > "$log" 2>&1 || true
        if [ ! -s "$log" ]; then
          echo "(operator log empty)"
          exit 0
        fi

        # A stuck reconcile repeats one error many times, so the COUNT is the
        # tell. Strip the per-reconcile noise (ids, timestamps) so repetitions
        # collapse onto one line.
        echo "::group::operator errors by frequency (top 10)"
        if grep -qE '\bERROR\b' "$log"; then
          grep -E '\bERROR\b' "$log" \
            | sed -E 's/.*"error": "([^"]{0,180}).*/\1/' \
            | sed -E 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<uuid>/g' \
            | sort | uniq -c | sort -rn | head -10
        else
          echo "(no ERROR lines)"
        fi
        echo "::endgroup::"

        # cut -f4 (tab-delimited by default) pulls the message out of the
        # operator's "<ts>\t<level>\t<logger>\t<message>\t<json>" line. Do NOT
        # swap this for `sed 's/[^\t]*\t//'`: \t inside a bracket expression is
        # GNU-only, so it silently no-ops on BSD sed and the timestamp stays in
        # the key, defeating the deduplication.
        #
        # Warnings get the same counted treatment. A plain "last N" is useless
        # here: benign topology advisories ("2 servers provide limited fault
        # tolerance") repeat constantly and would push the one interesting
        # warning off the end.
        echo "::group::operator warning events by frequency (top 10)"
        if grep -qF '"type": "Warning"' "$log"; then
          grep -F '"type": "Warning"' "$log" \
            | cut -f4 \
            | cut -c1-180 \
            | sort | uniq -c | sort -rn | head -10
        else
          echo "(no Warning events)"
        fi
        echo "::endgroup::"

        echo "::group::operator log tail (last 150 lines)"
        tail -150 "$log"
        echo "::endgroup::"

    - name: Archive cluster logs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          cluster-debug.log
          /tmp/kind-*
        if-no-files-found: warn
